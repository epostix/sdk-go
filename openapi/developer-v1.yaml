    EventType:
      type: string
      enum:
        - email.sent
        - email.delivered
        - email.bounced
        - email.opened
        - email.clicked
        - email.complained
        - email.failed
        - email.delayed
        - email.received
        - webhook.test
      description: >
        Every event type the platform emits. email.* events carry an email_id, except
        email.received, which fires for inbound mail and carries an inbound_id.
        webhook.test is delivered by the test-endpoint operation and cannot be subscribed to.
        Treat this enum as open: clients must tolerate a value added by a later release
        rather than failing to decode the surrounding object.

    WebhookEventType:
      type: string
      enum:
        - email.sent
        - email.delivered
        - email.bounced
        - email.opened
        - email.clicked
        - email.complained
        - email.failed
        - email.delayed
        - email.received
      description: >
        An event a webhook endpoint can subscribe to. This is the subscribable subset of
        EventType; webhook.test is delivered to an endpoint but is not subscribable.
    WebhookCreateRequest:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          description: The URL to receive webhook events.
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
          description: Event types to subscribe to.
        description:
          type: string
          description: Optional description of the webhook endpoint.
        secret:
          type: string
          description: Signing secret. Auto-generated if omitted.

    WebhookCreateResponse:
      type: object
      required:
        - id
        - url
        - events
        - active
        - secret
        - created_at
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        description:
          type: string
        active:
          type: boolean
        secret:
          type: string
          description: Plaintext signing secret. Shown only on create and rotate.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Webhook:
      type: object
      required:
        - id
        - url
        - events
        - active
        - created_at
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        description:
          type: string
        active:
          type: boolean
        failure_count:
          type: integer
        disabled_at:
          type: string
          format: date-time
          nullable: true
        disabled_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookUpdateRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        description:
          type: string
        active:
          type: boolean

    WebhookListResponse:
      type: object
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
        has_more:
          type: boolean
        next_cursor:
          type: string

    WebhookDeliveryLog:
