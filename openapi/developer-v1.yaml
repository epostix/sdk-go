    ContactUpsert:
      type: object
      properties:
        name:
          type: string
          description: Contact display name.
        tag_ids:
          type: array
          items:
            type: string
          description: Tag IDs to assign to the contact.
    ContactListResponse:
      type: object
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        has_more:
