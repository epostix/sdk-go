    PermissionScope:
      type: string
      enum:
        - sending
        - 'emails:read'
        - 'domains:manage'
        - 'contacts:manage'
        - 'webhooks:manage'
        - 'analytics:read'
        - 'api-keys:manage'
        - 'suppressions:read'
        - 'suppressions:manage'
        - 'templates:read'
        - 'templates:manage'
        - 'inbound:read'
        - 'inbound:manage'
        - 'broadcasts:read'
        - 'broadcasts:manage'
        - 'broadcasts:send'
        - '*'
      description: >
        Permission scope for an API key. Base scopes grant access to all domains.
        Per-domain restriction is supported for `sending`, `emails:read`, and `domains:manage`
        using the format `{scope}:domain:{domain_name}`, for example `sending:domain:acme.com`,
        restricts sending to acme.com only. Multiple domain-scoped permissions can be combined.
    APIKeyResponse:
      type: object
      required:
        - id
        - name
        - environment
        - permissions
        - token_hint
        - created_at
      properties:
        id:
          type: string
          description: Unique API key identifier.
        name:
          type: string
          description: Human-readable name for this key.
        environment:
          type: string
          enum: [live, test]
          description: Key environment, live or test.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionScope'
          description: Permission scopes granted to this key.
        token_hint:
          type: string
          description: 'Masked token display, e.g. tix_live_...abcd1234'
        whitelist_ips:
          type: array
          items:
            type: string
          description: Allowed IP addresses in CIDR notation.
        created_at:
          type: string
          format: date-time
          description: When the key was created.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the key expires.
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: When the key was last used.
        last_used_ip:
          type: string
          nullable: true
          description: IP address of the last request using this key.
        request_count:
          type: integer
          format: int64
          description: Total number of requests made with this key.
    APIKeyCreateRequest:
      type: object
      required:
        - name
        - expires_at
      properties:
        name:
          type: string
          description: Human-readable name for this key.
        environment:
          type: string
          enum: [live, test]
          default: live
          description: Key environment.
        expires_at:
          type: string
          format: date-time
          description: When the key should expire.
        whitelist_ips:
          type: array
          items:
            type: string
          description: Allowed IP addresses in CIDR notation.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionScope'
          description: 'Permission scopes. Defaults to ["*"] (full access) if omitted.'
    APIKeyCreateResponse:
      type: object
      required:
        - id
        - name
        - environment
        - permissions
        - token_hint
        - token
        - created_at
      properties:
        id:
          type: string
        name:
          type: string
        environment:
          type: string
          enum: [live, test]
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionScope'
        token:
          type: string
          description: 'The full API key token. It is shown only once, so store it securely.'
        token_hint:
          type: string
          description: Last 8 characters for future identification.
        whitelist_ips:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
    APIKeyUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Updated name.
        whitelist_ips:
          type: array
          items:
            type: string
          description: Updated IP whitelist.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionScope'
          description: Updated permissions.
    APIKeyListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/APIKeyResponse'
        has_more:
