        '200':
          description: The cancelled broadcast
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Broadcast' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  responses:
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIError' }
    Forbidden:
      description: The API key may not perform this operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIError' }
    NotFound:
      description: No such record
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIError' }
    Conflict:
      description: The request conflicts with the current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIError' }
    ValidationFailed:
      description: One or more fields are invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIError' }
    RateLimited:
      description: Rate limit exceeded
      headers:
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
        RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
        RateLimit-Scope: { $ref: '#/components/headers/RateLimitScope' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIError' }
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIError' }
  headers:
    RateLimitLimit:
      description: >
        Requests permitted in the current window. Sent on every authenticated response;
        absent when the request failed authentication, because the limit is per workspace
        and the workspace is not yet known.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests still permitted in the current window. Sent on every authenticated response.
      schema: { type: integer }
    RateLimitReset:
      description: >
        Seconds until another request is permitted, or 0 when one already is.
        Sent on every authenticated response.
      schema: { type: integer }
    RateLimitPolicy:
      description: >
        The active policy as "{burst};w={window}", where window is in seconds.
        Sent on every authenticated response.
      schema: { type: string }
    RateLimitScope:
      description: >
        What the limit applies to. Always workspace, so a limiter inside one process
        cannot coordinate every worker. Sent on every authenticated response.
      schema: { type: string }
    RetryAfter:
      description: >
        Seconds to wait before retrying. Sent on rate_limit_exceeded, on
        daily_quota_exceeded as the seconds remaining until the next UTC midnight, and
        on idempotency_in_progress. Not sent on monthly_quota_exceeded.
      schema: { type: integer }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API key with tix_live_ or tix_test_ prefix. Legacy tix_ prefix also accepted.'
  schemas:
    MailboxAddress:
      oneOf:
        - type: string
          description: Email address as a plain string.
        - type: object
          required:
            - email
          properties:
            email:
              type: string
              format: email
            name:
              type: string
          description: Email address with optional display name.
    Attachment:
      type: object
      required:
        - filename
        - content
        - content_type
      properties:
        filename:
          type: string
          description: Filename of the attachment.
        content:
          type: string
          description: Base64-encoded file content.
        content_type:
          type: string
          description: MIME type of the attachment.
        content_disposition:
          type: string
          enum:
            - attachment
            - inline
          default: attachment
          description: Content disposition. Use "inline" for CID-referenced images.
        content_id:
          type: string
          description: Content-ID for inline images (e.g. "logo"). Referenced in HTML as cid:logo.
    AttachmentRef:
      type: object
      required:
        - attachment_id
      properties:
        attachment_id:
          type: string
          description: ID of a previously uploaded attachment.
    AttachmentURL:
      type: object
      required:
        - filename
        - content_url
      properties:
        filename:
          type: string
          description: Filename for the attachment.
        content_url:
          type: string
          format: uri
          description: URL to fetch the attachment from.
        content_type:
          type: string
          description: MIME type. Auto-detected from response if omitted.
    TrackingOptions:
      type: object
      properties:
        opens:
          type: boolean
          description: Override domain-level open tracking for this email.
        clicks:
          type: boolean
          description: Override domain-level click tracking for this email.
        clicks_exclude:
          type: array
          items:
            type: string
          description: URL patterns to exclude from click tracking (e.g. "unsubscribe", "magic_link").
    PreflightOptions:
      type: object
      properties:
        spam_check:
          type: boolean
          description: Run spam scoring on the email content before sending.
        validate:
          type: boolean
          description: Validate the email (DNS, formatting) before sending.
    PreflightResult:
      type: object
      properties:
        spam_score:
          type: number
          description: Spam score from content analysis.
        spam_action:
          type: string
          description: Recommended action based on spam score.
        validation_errors:
          type: array
          items:
            $ref: '#/components/schemas/APIErrorDetail'
          description: Validation issues found during preflight.
    SpamCheckResult:
      type: object
      properties:
        score:
          type: number
          format: double
          description: Rspamd spam score.
        threshold:
          type: number
          format: double
          description: Score threshold for spam classification.
        verdict:
          type: string
          enum: [pass, warn, fail]
          description: Overall verdict based on score.
        action:
          type: string
          description: Recommended action from spam filter.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/SpamRule'
          description: Per-rule breakdown from spam filter.
        details:
          $ref: '#/components/schemas/SpamCheckDetails'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/SpamIssue'
          description: Custom content issues detected.
    SpamRule:
      type: object
      properties:
        name:
          type: string
        score:
          type: number
          format: double
        description:
          type: string
        suggestion:
          type: string
    SpamIssue:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        suggestion:
          type: string
        severity:
          type: string
          enum: [warning, error]
    SpamCheckDetails:
      type: object
      properties:
        has_text_part:
          type: boolean
        has_html_part:
          type: boolean
        has_list_unsubscribe:
          type: boolean
        link_count:
          type: integer
        image_count:
          type: integer
        text_to_html_ratio:
          type: number
          format: double
    Email:
      type: object
      required:
        - id
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        from:
          type: string
        to:
          type: array
          items:
            type: string
        subject:
          type: string
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
          items:
            type: string
        reply_to:
          type: string
        text:
          type: string
        html:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        template_id:
          type: string
        template_data:
          type: object
          additionalProperties:
            type: string
        template_version:
          type: integer
          description: The template version this message was rendered from.
        mode:
          type: string
          enum: [live, test]
          description: Whether the email was submitted with a live or a test API key. Test emails are simulated and never delivered.
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          description: Arbitrary JSON metadata (up to 10KB).
        tracking:
          $ref: '#/components/schemas/TrackingOptions'
        scheduled_at:
          type: string
          format: date-time
          description: When the email is scheduled to be sent (ISO 8601).
        batch_id:
          type: string
          description: Batch ID if this email was part of a batch send.
        preflight_result:
          $ref: '#/components/schemas/PreflightResult'
        status:
          type: string
          enum:
            - pending
            - scheduled
            - sent
            - delivered
            - failed
            - cancelled
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: '#/components/schemas/EmailEvent'
          description: Timeline of email events (delivery, opens, clicks, bounces). Only populated on single email retrieval.
        error_message:
          type: string
          description: Error details if delivery failed.
        click_count:
          type: integer
          description: Number of tracked link clicks.
        open_count:
          type: integer
          description: Number of tracked opens.
        delivery_time_ms:
          type: integer
          format: int64
          description: Milliseconds from creation to delivery.
    EmailEvent:
      type: object
      required:
        - status
        - created_at
      properties:
        status:
          type: string
          description: Email status at the time of this event.
        created_at:
          type: string
          format: date-time
          description: When this event occurred.
        event_type:
          type: string
          description: Specific event type (e.g. opened, clicked, bounced).
    Event:
      type: object
      required:
        - id
        - type
        - created_at
        - data
      properties:
        id:
          type: string
          description: Unique event identifier.
        type:
          $ref: '#/components/schemas/EventType'
        email_id:
          type: string
          description: >
            ID of the email this event belongs to. Present for every email.* event and
            absent for email.received and webhook.test.
        inbound_id:
          type: string
          description: ID of the inbound message. Present only on email.received.
        created_at:
          type: string
          format: date-time
          description: When the event occurred.
        data:
          type: object
          additionalProperties: true
          description: |
            Event-specific data. Structure varies by event type:
            - **delivered**: to, from, subject, delivered_at, smtp_code, mx_host
            - **bounced**: to, bounce_type, bounce_subtype, smtp_code, enhanced_status_code, provider, recommended_action, original_error
            - **opened**: to, ip_address, user_agent, open_source
            - **clicked**: to, url, ip_address, user_agent, click_count
            - **complained**: to, bounce_type
            - **sent/failed/delayed**: event metadata
    EventListResponse:
      type: object
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        has_more:
          type: boolean
          description: Whether there are more items available after this page.
        next_cursor:
          type: string
          description: Cursor to use as starting_after for the next page.
    EmailCreate:
      type: object
      required:
        - from
        - to
        - subject
      properties:
        from:
          $ref: '#/components/schemas/MailboxAddress'
          description: Sender email address as a string or {email, name} object.
        to:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: Recipient email address(es).
        subject:
          type: string
        cc:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        bcc:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        reply_to:
          $ref: '#/components/schemas/MailboxAddress'
          description: Reply-to address as a string or {email, name} object.
        text:
          type: string
        html:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        template_id:
          type: string
        template_data:
          type: object
          additionalProperties:
            type: string
        template_version:
          type: integer
          minimum: 1
          description: Render a specific template version instead of the published one. Use this for safe deploys.
        attachments:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Attachment'
              - $ref: '#/components/schemas/AttachmentRef'
              - $ref: '#/components/schemas/AttachmentURL'
          description: File attachments. Supports inline content, pre-uploaded references, and URL-based.
        tags:
          type: array
          items:
            type: string
          maxItems: 50
          description: String tags for categorization. Indexed and queryable.
        metadata:
          type: object
          description: Arbitrary JSON metadata (up to 10KB). Stored and returned in events/webhooks.
        tracking:
          $ref: '#/components/schemas/TrackingOptions'
        preflight:
          $ref: '#/components/schemas/PreflightOptions'
        scheduled_at:
          type: string
          format: date-time
          description: Schedule the email for future delivery (ISO 8601). Must be in the future and within 72 hours.
        allow_duplicate:
          type: boolean
          description: Set to true to bypass duplicate detection. Use for legitimate cases like OTP resends.
    EmailUpdate:
      type: object
      properties:
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: Reschedule the email. Set to null to send immediately. Must be in the future and within 72 hours.
    EmailBatchRequest:
      type: object
      required:
        - emails
      properties:
        validation:
          type: string
          enum: [strict, permissive]
          default: strict
          description: >
            strict rejects the whole batch with 422 if any message is invalid, and sends nothing.
            permissive sends the valid messages and reports the rest per index in errors.
        emails:
          type: array
          items:
            $ref: '#/components/schemas/EmailCreate'
          minItems: 1
          maxItems: 100
          description: Array of emails to send (1-100).
    EmailBatchResponse:
      type: object
      required:
        - batch_id
        - results
      properties:
        batch_id:
          type: string
          description: Unique identifier for the batch.
        results:
          type: array
          items:
            $ref: '#/components/schemas/EmailBatchResult'
        errors:
          type: array
          description: Present in permissive mode only. One entry per message that was not sent.
          items:
            $ref: '#/components/schemas/EmailBatchError'
    EmailBatchError:
      type: object
      required:
        - index
        - code
        - message
      properties:
        index:
          type: integer
          description: Position of the message in the request array.
        code:
          type: string
          description: Machine-readable reason, matching the error type catalogue.
        message:
          type: string
    EmailBatchResult:
      type: object
      required:
        - index
        - status
      properties:
        index:
          type: integer
          description: Zero-based index of the email in the request array.
        id:
          type: string
          description: Email ID (present on success).
        status:
          type: string
          enum:
            - pending
            - scheduled
            - failed
        error:
          $ref: '#/components/schemas/APIError'
          description: Error details (present on failure).
    AttachmentUpload:
      type: object
      required:
        - filename
        - content
        - content_type
      properties:
        filename:
          type: string
        content:
          type: string
          description: Base64-encoded file content.
        content_type:
          type: string
    AttachmentResponse:
      type: object
      required:
        - id
        - filename
        - content_type
        - size
        - expires_at
      properties:
        id:
          type: string
          description: Attachment ID for use in email sends.
        filename:
          type: string
        content_type:
          type: string
        size:
          type: integer
          description: Size in bytes.
        expires_at:
          type: string
          format: date-time
          description: When this pre-uploaded attachment expires (24 hours from upload).
    CancelEmailResponse:
      type: object
      required:
        - cancelled
      properties:
        cancelled:
          type: boolean
          description: Whether the email was successfully cancelled.
        reason:
          type: string
          description: Reason why the email could not be cancelled (present when cancelled is false).
    EmailListResponse:
      type: object
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Email'
        has_more:
          type: boolean
          description: Whether there are more items available after this page.
        next_cursor:
          type: string
          description: Cursor to use as starting_after for the next page.
    Template:
      type: object
      required: [id, name, latest_version, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        subject: { type: string }
        latest_version:
          type: integer
          description: The highest version number that exists.
        published_version:
          type: integer
          description: The version used when a send does not name one. Absent until a version is published.
        archived_at: { type: string, format: date-time }
        variables:
          type: array
          items: { type: string }
          description: Variable names found in the draft.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TemplateWithContent:
      allOf:
        - $ref: '#/components/schemas/Template'
        - type: object
          properties:
            version:
              type: integer
              description: The version this content came from. Absent when the draft is returned.
            html: { type: string }
            text: { type: string }
    TemplateCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 80 }
        subject: { type: string, maxLength: 255 }
        html: { type: string }
        text: { type: string }
        publish:
          type: boolean
          default: true
          description: Publish the first version immediately. Set false to create a draft only.
    TemplateUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        subject: { type: string, maxLength: 255 }
        html: { type: string }
        text: { type: string }
    TemplateVersion:
      type: object
      required: [version, checksum, created_at]
      properties:
        version: { type: integer }
        subject: { type: string }
        html: { type: string }
        text: { type: string }
        variables:
          type: array
          items: { type: string }
        checksum: { type: string }
        created_at: { type: string, format: date-time }
    TemplateVersionCreate:
      type: object
      properties:
        subject: { type: string, maxLength: 255 }
        html: { type: string }
        text: { type: string }
        publish:
          type: boolean
          default: true
          description: Make this the published version. Set false to record it without switching sends to it.
    TemplatePublishRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
    TemplateRenderRequest:
      type: object
      properties:
        template_id: { type: string }
        version: { type: integer, minimum: 1 }
        subject: { type: string }
        html: { type: string }
        text: { type: string }
        data:
          type: object
          additionalProperties: { type: string }
      description: Supply either template_id, or an inline subject, html and text. Not both.
    TemplateRenderResult:
      type: object
      properties:
        subject: { type: string }
        html: { type: string }
        text: { type: string }
        variables:
          type: array
          items: { type: string }
        missing_variables:
          type: array
          items: { type: string }
          description: Variables the template uses without a default, that were not supplied in data.
    TemplateListResponse:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Template' }
        has_more: { type: boolean }
        next_cursor: { type: string }
    TemplateVersionListResponse:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TemplateVersion' }
        has_more: { type: boolean }
        next_cursor: { type: string }
    AnalyticsCounts:
      type: object
      required: [accepted, delivered, failed, bounced, unique_opens, unique_clicks, raw_opens, raw_clicks, machine_opens, apple_mpp_opens]
      properties:
        accepted:
          type: integer
          format: int64
          description: Messages accepted for delivery. This is not the same as handed to a mail server.
        delivered: { type: integer, format: int64 }
        failed:
          type: integer
          format: int64
          description: Messages that were not delivered. Bounces are included in this number.
        bounced:
          type: integer
          format: int64
          description: Bounce events. A subset of failed, not an addition to it.
        unique_opens:
          type: integer
          format: int64
          description: First qualifying open per message, excluding machine opens.
        unique_clicks: { type: integer, format: int64 }
        raw_opens: { type: integer, format: int64 }
        raw_clicks: { type: integer, format: int64 }
        machine_opens:
          type: integer
          format: int64
          description: Opens attributed to scanners and privacy proxies rather than a person.
        apple_mpp_opens: { type: integer, format: int64 }
    AnalyticsSummary:
      type: object
      required: [start, end, as_of, counts]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        as_of:
          type: string
          format: date-time
          description: When the underlying aggregate was last reconciled.
        counts: { $ref: '#/components/schemas/AnalyticsCounts' }
    AnalyticsBucket:
      type: object
      required: [start, counts]
      properties:
        start: { type: string, format: date-time }
        counts: { $ref: '#/components/schemas/AnalyticsCounts' }
    AnalyticsTimeseries:
      type: object
      required: [start, end, interval, as_of, data]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        interval: { type: string, enum: [hour, day] }
        as_of: { type: string, format: date-time }
        data:
          type: array
          items: { $ref: '#/components/schemas/AnalyticsBucket' }
    SpamAction:
      type: string
      enum: [no_action, greylist, add_header, rewrite_subject, soft_reject, reject, discard, quarantine]
    InboundEmail:
      type: object
      required: [id, domain_id, from, to, subject, spam_score, spam_action, size_bytes, attachment_count, received_at]
      properties:
        id: { type: string }
        domain_id: { type: string }
        from: { type: string }
        to:
          type: array
          items: { type: string }
          description: Every address this message was addressed to at your domains.
        subject: { type: string }
        message_id:
          type: string
          description: The sender's own Message-ID header, for correlating with your logs.
        spam_score: { type: number, format: double }
        spam_action: { $ref: '#/components/schemas/SpamAction' }
        size_bytes: { type: integer, format: int64 }
        attachment_count: { type: integer }
        received_at: { type: string, format: date-time }
    InboundEmailContent:
      type: object
      required: [id]
      properties:
        id: { type: string }
        subject: { type: string }
        from: { type: string }
        to:
          type: array
          items: { type: string }
        html: { type: string }
        text: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/InboundEmailAttachment' }
    InboundEmailAttachment:
      type: object
      properties:
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        content_id: { type: string }
    InboundEmailListResponse:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/InboundEmail' }
        has_more: { type: boolean }
        next_cursor: { type: string }
    BroadcastStatus:
      type: string
      enum: [draft, scheduled, sending, paused, cancelled, completed]
    BroadcastStats:
      type: object
      properties:
        accepted: { type: integer, format: int64 }
        delivered: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        bounced: { type: integer, format: int64 }
        unique_opens: { type: integer, format: int64 }
        unique_clicks: { type: integer, format: int64 }
    Broadcast:
      type: object
      required: [id, status, subject, from, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/BroadcastStatus' }
        subject: { type: string }
        from: { type: string }
        from_name: { type: string }
        audience_ids:
          type: array
          items: { type: string }
          description: Tag ids the broadcast is addressed to. Empty means every subscribed contact.
        scheduled_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time }
        total_recipients: { type: integer, format: int64 }
        stats: { $ref: '#/components/schemas/BroadcastStats' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BroadcastCreate:
      type: object
      required: [subject, from]
      properties:
        subject: { type: string, maxLength: 255 }
        from: { type: string }
        from_name: { type: string }
        audience_ids:
          type: array
          items: { type: string }
        html: { type: string }
        text: { type: string }
        preheader: { type: string }
        scheduled_at: { type: string, format: date-time }
    BroadcastUpdate:
      type: object
      properties:
        subject: { type: string, maxLength: 255 }
        html: { type: string }
        text: { type: string }
        preheader: { type: string }
        scheduled_at: { type: string, format: date-time }
    BroadcastTestRequest:
      type: object
      required: [recipients]
      properties:
        recipients:
          description: |
            Each address must belong to a confirmed member of this workspace. A broadcast test
            is a live send from a verified domain, so it may not be aimed at arbitrary addresses.
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, format: email }
    BroadcastTestResult:
      type: object
      properties:
        accepted: { type: integer }
        recipients:
          type: array
          items: { type: string }
    BroadcastListResponse:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Broadcast' }
        has_more: { type: boolean }
        next_cursor: { type: string }
    APIError:
      type: object
      required:
        - status
        - type
        - message
        - request_id
      properties:
        status:
          type: integer
          description: HTTP status code.
        type:
          type: string
          enum:
            - invalid_request
            - validation_error
            - unsupported_media_type
            - payload_too_large
            - method_not_allowed
            - not_found
            - authentication_failed
            - api_key_expired
            - insufficient_scope
            - api_key_ip_restricted
            - domain_scope_restricted
            - workspace_suspended
            - test_mode_restricted
            - domain_not_found
            - domain_not_verified
            - invalid_from_address
            - duplicate_detected
            - invalid_schedule
            - email_not_cancellable
            - batch_too_large
            - template_not_found
            - template_render_failed
            - attachment_not_found
            - attachment_expired
            - attachment_too_large
            - attachment_fetch_failed
            - rate_limit_exceeded
            - daily_quota_exceeded
            - monthly_quota_exceeded
            - idempotency_conflict
            - idempotency_in_progress
            - api_key_in_use
            - webhook_limit_reached
            - webhook_url_not_allowed
            - internal_error
            - service_unavailable
          description: Machine-readable error type.
        message:
          type: string
          description: Human-readable error message.
        request_id:
          type: string
          description: Unique request identifier for support debugging.
        doc_url:
          type: string
          description: Link to documentation for this error type.
        details:
          type: array
          items:
            $ref: '#/components/schemas/APIErrorDetail'
          description: Additional error details for validation errors.
    APIErrorDetail:
      type: object
      required:
        - field
        - message
        - code
      properties:
        field:
          type: string
          description: The field that caused the error.
        message:
          type: string
          description: Human-readable description of the field error.
        code:
          type: string
          description: Machine-readable error code for this field.
    DomainCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Fully qualified domain name.
          example: "notifications.example.com"
        region:
          type: string
          description: Sending infrastructure region.
          default: "eu-west-1"
          example: "eu-west-1"
        sending_subdomain:
          type: string
          maxLength: 63
          description: >-
            Label the SPF and inbound MX records are published under, and the domain part of
            the Return-Path this domain sends with. Omit to use the default `tix`. Send an
            empty string to publish those records on the domain itself.
          example: "tix"
    DomainUpdate:
      type: object
      properties:
        open_tracking:
          type: object
          properties:
            marketing:
              type: boolean
            transactional:
              type: boolean
        click_tracking:
          type: object
          properties:
            marketing:
              type: boolean
            transactional:
              type: boolean
    Domain:
      type: object
      required:
        - id
        - name
        - status
        - region
        - created_at
        - dns_records
      properties:
        id:
          type: string
          description: Unique domain identifier.
        name:
          type: string
          description: Fully qualified domain name.
          example: "notifications.example.com"
        status:
          type: string
          enum:
            - unverified
            - verifying
            - active
          description: Domain verification status.
        region:
          type: string
          description: Sending infrastructure region.
          example: "eu-west-1"
        open_tracking:
          type: object
          properties:
            marketing:
              type: boolean
            transactional:
              type: boolean
        click_tracking:
          type: object
          properties:
            marketing:
              type: boolean
            transactional:
              type: boolean
        last_dns_check_at:
          type: string
          format: date-time
          nullable: true
          description: When DNS records were last checked.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        dns_records:
          type: array
          items:
            $ref: '#/components/schemas/DnsRecord'
          description: DNS records that need to be configured for this domain.
        sending_subdomain:
          type: string
          description: >-
            Label the SPF and inbound MX records are published under, and the domain part of
            the Return-Path. Empty means those records sit on the domain itself.
          example: "tix"
      example:
        id: "d_abc123"
        name: "notifications.example.com"
        status: "unverified"
        region: "eu-west-1"
        open_tracking:
          marketing: true
          transactional: false
        click_tracking:
          marketing: true
          transactional: false
        created_at: "2026-04-21T10:00:00Z"
        updated_at: "2026-04-21T10:00:00Z"
        dns_records:
          - type: "TXT"
            host: "default.notifications"
            value: "v=spf1 include:send.epostix.com ~all"
            status: "unverified"
            purpose: "sending"
            required: true
          - type: "TXT"
            host: "send._domainkey.notifications"
            value: "v=DKIM1; k=rsa; p=MIIBIjANBgkqhki..."
            status: "unverified"
            purpose: "sending"
            required: true
          - type: "TXT"
            host: "_dmarc.notifications"
            value: "v=DMARC1; p=none;"
            status: "unverified"
            purpose: "sending"
            required: false
          - type: "MX"
            host: "default.notifications"
            value: "mxa.send.epostix.com"
            status: "unverified"
            priority: 10
            purpose: "receiving"
            required: false
    DnsRecord:
      type: object
      required:
        - type
        - host
        - value
        - status
        - purpose
        - required
      properties:
        type:
          type: string
          enum:
            - TXT
            - MX
          description: DNS record type.
        host:
          type: string
          description: >-
            Host to set this record on, relative to the zone. `@` means the zone root.
          example: "send._domainkey.notifications.example.com"
        value:
          type: string
          description: Expected DNS record value.
          example: "v=DKIM1; k=rsa; p=MIIBIj..."
        status:
          type: string
          enum:
            - unverified
            - verifying
            - active
            - failed
          description: Verification status of this record.
        priority:
          type: integer
          description: MX record priority. Only present for MX records.
          example: 10
        purpose:
          type: string
          enum:
            - sending
            - receiving
          description: Whether this record is for sending (SPF, DKIM, DMARC) or receiving (MX).
        kind:
          type: string
          enum:
            - spf
            - dkim
            - dmarc
            - mx_inbound
          description: Semantic kind of the record (so clients can label rows without parsing values).
        last_verification_error:
          type: string
          description: Human-readable explanation of the most recent verification failure. Empty when verified.
        required:
          type: boolean
          description: Whether this record must be verified for the domain to become active.
    DomainListResponse:
      type: object
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
        has_more:
          type: boolean
          description: Whether there are more items available after this page.
        next_cursor:
          type: string
          description: Cursor to use as starting_after for the next page.
    Contact:
      type: object
      required:
        - id
        - email
        - status
        - source
        - engagement_tier
        - tags
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique contact identifier.
        email:
          type: string
          format: email
          description: Contact email address.
        name:
          type: string
          description: Contact display name.
        status:
          type: string
          enum:
            - subscribed
            - unsubscribed
            - cleaned
          description: Subscription status (read-only, computed by the system).
        source:
          type: string
          enum:
            - api
            - bulk_api
            - csv_import
            - smtp
            - form
            - unknown
          description: How the contact was created (read-only).
        engagement_tier:
          type: string
          enum:
            - no_data
            - new
            - engaged
            - at_risk
            - inactive
            - cold
          description: Engagement tier based on email activity (read-only, computed by the system).
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          description: Tags assigned to this contact.
        campaigns_received_count:
          type: integer
          description: Number of campaigns this contact has received (read-only).
        last_activity_at:
          type: string
          format: date-time
          nullable: true
          description: Last activity timestamp (read-only).
        created_at:
          type: string
          format: date-time
          description: When the contact was created.
        updated_at:
          type: string
          format: date-time
          description: When the contact was last updated.
    ContactCreate:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
