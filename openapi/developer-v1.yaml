openapi: 3.0.3
info:
  title: Epostix Developer API
  description: Epostix Developer API
  version: 1.0.0
servers:
  - url: 'https://api.epostix.com/v1'
    description: Production server
  - url: 'https://api.staging.epostix.com/v1'
    description: Staging server
tags:
  - name: Emails
    description: Send a message, read it back, and follow what happened to it.
  - name: Batch
    description: Submit up to 100 messages in one request.
  - name: Spam check
    description: Score a message before you send it, so you find problems while you can still fix them.
  - name: Templates
    description: Reusable content with variables, versioned so a deploy cannot change what is already going out.
  - name: Attachments
    description: Upload a file once and reference it from a send.
  - name: Domains
    description: Add, verify and configure the domains you send from.
  - name: Events
    description: The delivery timeline for your messages.
  - name: Inbound
    description: Mail received at your verified domains.
  - name: Analytics
    description: Aggregate counts for a time range. Counts only, never rates.
  - name: Broadcasts
    description: One message to an audience. The dashboard remains the authoring surface.
  - name: Contacts
    description: The people you send to, and their subscription state.
  - name: Tags
    description: Labels that group contacts into an audience.
  - name: Suppressions
    description: Addresses that will not be sent to, and why.
  - name: Webhooks
    description: Endpoints that receive events as they happen.
  - name: API keys
    description: Credentials, their scopes, and what has been done with them.
paths:
  /emails:
    post:
      tags: [Emails]
      summary: Send an email
      description: Send a transactional email. Domain is derived from the `from` address.
      operationId: sendEmail
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 255
          description: Unique key to ensure idempotent request processing. Cached for 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCreate'
      responses:
        '201':
          description: Email sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Email'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    get:
      tags: [Emails]
      summary: List emails
      description: List emails across all domains with cursor-based pagination and filtering.
      operationId: listEmails
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
          description: Number of items to return (1-100, default 25)
        - name: starting_after
          in: query
          required: false
          schema:
            type: string
          description: Cursor for forward pagination. Returns items after this ID.
        - name: ending_before
          in: query
          required: false
          schema:
            type: string
          description: Cursor for backward pagination. Returns items before this ID.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - scheduled
              - sent
              - delivered
              - failed
              - cancelled
          description: Filter by email status.
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: Filter by recipient email address (partial match).
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: Filter by sender email address (partial match).
        - name: subject
          in: query
          required: false
          schema:
            type: string
          description: Filter by subject (partial match).
        - name: tags
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: Filter by tags (emails matching any of the provided tags).
        - name: created_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter emails created after this timestamp (ISO 8601).
        - name: created_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter emails created before this timestamp (ISO 8601).
        - name: domain_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by domain ID.
      responses:
        '200':
          description: List of emails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /emails/check:
    post:
      tags: [Spam check]
      summary: Check email spam score
      description: Score email content for spam without sending. Returns spam score, per-rule breakdown, and actionable suggestions.
      operationId: checkEmail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCreate'
      responses:
        '200':
          description: Spam check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpamCheckResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /emails/batch:
    post:
      tags: [Batch]
      summary: Send a batch of emails
      description: Send up to 100 transactional emails in a single request. Returns per-email results.
      operationId: sendEmailBatch
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 255
          description: Unique key to ensure idempotent request processing. Cached for 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailBatchRequest'
      responses:
        '200':
          description: Batch processed (may contain partial failures)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailBatchResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /emails/{email_id}:
    parameters:
      - name: email_id
        in: path
        required: true
        schema:
          type: string
        description: Email ID
    patch:
      tags: [Emails]
      summary: Update an email
      description: Update a pending email. Currently supports rescheduling via `scheduled_at`.
      operationId: updateEmail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailUpdate'
      responses:
        '200':
          description: Email updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Email'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    get:
      tags: [Emails]
      summary: Get an email
      description: Retrieve a single email by ID.
      operationId: getEmail
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Email details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Email'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /emails/{email_id}/cancel:
    parameters:
      - name: email_id
        in: path
        required: true
        schema:
          type: string
        description: Email ID
    post:
      tags: [Emails]
      summary: Cancel an email
      description: |
        Cancel an email that hasn't been delivered yet. Works for scheduled emails
        and recently-sent emails still in the processing queue (~10 second window).
      operationId: cancelEmail
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cancel result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelEmailResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /emails/{email_id}/events:
    get:
      tags: [Emails]
      summary: List events for an email
      description: Returns the full event timeline for a specific email, including delivery, opens, clicks, bounces, and complaints.
      operationId: listEmailEvents
      security:
        - bearerAuth: []
      parameters:
        - name: email_id
          in: path
          required: true
          schema:
            type: string
          description: Email ID.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
          description: Number of items to return (1-100, default 25).
        - name: starting_after
          in: query
          required: false
          schema:
            type: string
          description: Cursor for forward pagination. Returns items after this event ID.
        - name: ending_before
          in: query
          required: false
          schema:
            type: string
          description: Cursor for backward pagination. Returns items before this event ID.
      responses:
        '200':
          description: List of events for the email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Email not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /emails/{email_id}/resend:
    parameters:
      - name: email_id
        in: path
        required: true
        schema:
          type: string
        description: Email ID of the original email to resend
    post:
      tags: [Emails]
      summary: Resend an email
      description: Resend a previously sent or failed email. Creates a new email with the same content and returns the new email ID.
      operationId: resendEmail
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Email resent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Email'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: Email cannot be resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /events:
    get:
      tags: [Events]
      summary: List events
      description: List all email events across the account with cursor-based pagination and filtering. Events include deliveries, opens, clicks, bounces, complaints, and more.
      operationId: listEvents
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
          description: Number of items to return (1-100, default 25).
        - name: starting_after
          in: query
          required: false
          schema:
            type: string
          description: Cursor for forward pagination. Returns items after this event ID.
        - name: ending_before
          in: query
          required: false
          schema:
            type: string
          description: Cursor for backward pagination. Returns items before this event ID.
        - name: event_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - sent
              - delivered
              - bounced
              - opened
              - clicked
              - complained
              - failed
              - delayed
          description: Filter by event type.
        - name: email_id
          in: query
          required: false
          schema:
            type: string
          description: Filter events for a specific email.
        - name: domain_id
          in: query
          required: false
          schema:
            type: string
          description: Filter events for a specific domain.
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: Filter by recipient email address (partial match).
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: Filter by sender email address (partial match).
        - name: tags
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: Filter by email tags (events for emails matching any of the provided tags).
        - name: created_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter events created after this timestamp (ISO 8601).
        - name: created_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter events created before this timestamp (ISO 8601).
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
              examples:
                delivered:
                  summary: Delivered event
                  value:
                    data:
                      - id: "evt_abc123"
                        type: "email.delivered"
                        email_id: "em_xyz789"
                        created_at: "2024-01-15T10:30:00Z"
                        data:
                          to: "user@example.com"
                          from: "sender@yourdomain.com"
                          subject: "Welcome aboard"
                          delivered_at: "2024-01-15T10:30:01Z"
                          smtp_code: 250
                          mx_host: "alt1.gmail-smtp-in.l.google.com"
                    has_more: false
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /events/{event_id}:
    get:
      tags: [Events]
      summary: Get an event
      description: Retrieve a single event by ID with full metadata. Includes event-specific data such as bounce details, click URLs, or open source information.
      operationId: getEvent
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
          description: Event ID.
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
              examples:
                bounce:
                  summary: Bounce event
                  value:
                    id: "evt_def456"
                    type: "email.bounced"
                    email_id: "em_xyz789"
                    created_at: "2024-01-15T10:30:02Z"
                    data:
                      to: "invalid@example.com"
                      bounce_type: "hard"
                      bounce_subtype: "mailbox_not_found"
                      smtp_code: 550
                      enhanced_status_code: "5.1.1"
                      provider: "gmail"
                      recommended_action: "clean"
                      original_error: "550 5.1.1 The email account does not exist"
                click:
                  summary: Click event
                  value:
                    id: "evt_ghi789"
                    type: "email.clicked"
                    email_id: "em_xyz789"
                    created_at: "2024-01-15T11:00:00Z"
                    data:
                      to: "user@example.com"
                      url: "https://example.com/pricing"
                      ip_address: "192.168.1.1"
                      user_agent: "Mozilla/5.0..."
                      click_count: 1
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /domains:
    get:
      tags: [Domains]
      summary: List domains
      description: List all sending domains with cursor-based pagination.
      operationId: listDomains
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
          description: Number of items to return (1-100, default 25).
        - name: starting_after
          in: query
          required: false
          schema:
            type: string
          description: Cursor for forward pagination. Pass the id of the last item from the previous page.
        - name: ending_before
          in: query
          required: false
          schema:
            type: string
          description: Cursor for backward pagination.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - unverified
              - verifying
              - active
          description: Filter domains by verification status.
      responses:
        '200':
          description: List of domains
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    post:
      tags: [Domains]
      summary: Add a domain
      description: Add a new sending domain. Returns the domain with DNS records that need to be configured.
      operationId: createDomain
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainCreateRequest'
      responses:
        '201':
          description: Domain created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /domains/{domain_id}:
    get:
      tags: [Domains]
      summary: Get a domain
      description: Get a domain with its DNS records and verification status.
      operationId: getDomain
      security:
        - bearerAuth: []
      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: string
          description: The domain ID.
      responses:
        '200':
          description: Domain details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    patch:
      tags: [Domains]
      summary: Update domain settings
      description: Update tracking settings for a domain.
      operationId: updateDomain
      security:
        - bearerAuth: []
      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: string
          description: The domain ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainUpdate'
      responses:
        '200':
          description: Domain updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
